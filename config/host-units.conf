# What this box does not run: it serves Strata only (the maintainer's decision of 2026-10-18).  scripts/host-units.sh
# checks these states (check-drift.sh runs it) and sets them (apply, with sudo).  The states before the change are in
# results/host-units-before-20261018.txt.  Kept on purpose: ssh, tailscaled and netbird (remote access),
# NetworkManager and wpa_supplicant (the network), vmware-tools, zfs-zed, nvidia-persistenced, cron, rsyslog,
# irqbalance, acpid, systemd-oomd and unattended-upgrades (security updates; the NVIDIA packages are on hold).
#
# <state> <scope> <unit>        state: default (the boot target), disabled, masked (also cannot be started by D-Bus or
#                               a socket); scope: system, or user (the service account's own systemd instance)
#                               A disabled unit that the machine does not have passes as not installed;
#                               tests/test_host_units.py checks each name against results/host-units-before-*.txt
default system multi-user.target                    # no desktop: gdm, Xorg and GNOME
disabled system cups.service                        # printing
disabled system cups.socket
disabled system cups.path
disabled system cups-browsed.service
disabled system avahi-daemon.socket                 # mDNS
masked system avahi-daemon.service
masked system ModemManager.service                  # mobile modems
masked system fwupd.service                         # device firmware updates: a VMware VM has none to update
disabled system fwupd-refresh.timer
masked system packagekit.service                    # the desktop's package manager (apt is used directly)
masked system colord.service                        # desktop colour profiles
masked system switcheroo-control.service            # laptop GPU switching
masked system power-profiles-daemon.service         # laptop power profiles
disabled system kerneloops.service                  # oops reports to Canonical
masked system upower.service                        # batteries
masked system udisks2.service                       # desktop disk automount
masked system accounts-daemon.service               # the desktop's user list
masked system rtkit-daemon.service                  # real-time scheduling for desktop audio
disabled system docker.service                      # no containers run here (the images stay on disk)
disabled system docker.socket
disabled system containerd.service
disabled system snapd.service                       # only desktop snaps
disabled system snapd.socket
disabled system snapd.seeded.service
disabled system motd-news.timer                     # login-message downloads
disabled system update-notifier-download.timer
disabled system update-notifier-motd.timer
disabled system man-db.timer                        # manual page index
disabled system e2scrub_all.timer                   # ext4 checks: the filesystems are ZFS
masked user pipewire.socket                         # the login session's audio server
masked user pipewire.service
masked user pipewire-media-session.service
masked user snap.snapd-desktop-integration.snapd-desktop-integration.service   # enabled for every user (--global): only a mask stops it
