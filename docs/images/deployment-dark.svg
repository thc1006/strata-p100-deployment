<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title id="t">Where the service ran: run ab3-iq3s-1, 2026-10-20</title>
<desc id="d">Where the service ran in run ab3-iq3s-1 on 2026-10-20. Clients send requests to server.py, which runs 4 requests at a time on one Strata 0.1.45 engine. The engine splits the model's 48 layers over four Tesla P100 cards, and a token passes them in turn: GPU 0 runs layers 0 to 12 with 11.6 GiB of expert cache and had 14.6 GiB in use at most; GPU 1 runs layers 13 to 24 with 11.5 GiB of expert cache and had 14.2 GiB in use at most; GPU 2 runs layers 25 to 37 with 12.2 GiB of expert cache and had 14.9 GiB in use at most; GPU 3 runs layers 38 to 47 with 10.7 GiB of expert cache and had 14.7 GiB in use at most. Each card has 16 GiB; the memory in use is the most seen in the 27 minutes of the run. 98% of the experts are on the cards. Host RAM, 62.8 GiB, holds the per-layer embedding table, 26.8 GiB locked; 5.5 GiB of experts, page-locked: the 2% no card holds, and copies of the experts in the card slots that reading a prompt borrows; and the parked conversations, 8.0 GiB at most. Each card reads RAM over PCIe at 11.0–11.5 GB/s. This repository checks the config before every start, waits for the load, checks the service every 2 minutes, and compares the machine with the repository when asked.</desc>
